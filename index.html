<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TP Plantilla</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="browser">
    <div class="browser-top">
      <div class="orange-tab"></div>
      <div class="gray-tab"></div>
    </div>
    <div class="browser-bar">
      <div class="browser-square"></div>
      <div class="browser-square"></div>
      <div class="address-bar"></div>
      <div class="browser-square"></div>
      <div class="browser-square"></div>
    </div>
  </div>

  <header class="site-header">
    <div class="header-brand"></div>
    <div class="header-links">
      <span></span><span></span>
    </div>
    <div class="header-search">
      <div class="search-input"></div>
      <div class="search-button"></div>
    </div>
  </header>

  <main class="page">
    <section class="hero">
      <div class="hero-title"></div>
      <div class="hero-line long"></div>
      <div class="hero-line long"></div>

      <div class="hero-toolbar">
        <div class="toolbar-small"><span></span><span></span><span></span><span></span></div>
        <div class="toolbar-fields"><span></span><span></span></div>
        <div class="toolbar-dark"></div>
      </div>

      <div class="hero-rule"></div>

      <div class="feature-grid">
        <article class="feature">
          <div class="feature-image"></div>
          <div class="feature-text"><span></span><span></span><span></span></div>
        </article>
        <article class="feature">
          <div class="feature-image"></div>
          <div class="feature-text"><span></span><span></span><span></span></div>
        </article>
        <article class="feature">
          <div class="feature-image"></div>
          <div class="feature-text"><span></span><span></span><span></span></div>
        </article>
        <article class="feature">
          <div class="feature-image"></div>
          <div class="feature-text"><span></span><span></span><span></span></div>
        </article>
      </div>
    </section>

    <section class="carousel">
      <button class="arrow left" aria-label="Anterior"></button>
      <div class="carousel-image"></div>
      <div class="carousel-copy">
        <div class="carousel-title"></div>
        <div class="carousel-line"></div>
        <div class="carousel-line"></div>
        <div class="carousel-line"></div>
        <div class="carousel-line short"></div>
      </div>
      <button class="arrow right" aria-label="Siguiente"></button>
    </section>

    <section class="cards">
      <article class="card"><div class="card-image"></div><div class="card-text"><span></span><span></span><span></span></div></article>
      <article class="card"><div class="card-image"></div><div class="card-text"><span></span><span></span><span></span></div></article>
      <article class="card"><div class="card-image"></div><div class="card-text"><span></span><span></span><span></span></div></article>
      <article class="card"><div class="card-image"></div><div class="card-text"><span></span><span></span><span></span></div></article>
    </section>
  </main>
</body>
</html>
